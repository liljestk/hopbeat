<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6e2c9">
<title>Hopbeat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;background:#f6e2c9}
  html,body{margin:0;height:100%;background:#f6e2c9;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ============================================================
//  HOPBEAT — tap the pad as the ring closes, on the beat.
// ============================================================
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const FONT = 'Fredoka, "Trebuchet MS", sans-serif';

// plasticine palette
const TEAL = '#2fb0a3', PINK = '#ec5d86', GOLD = '#f6b53a', RED = '#dd3f35', MINT = '#7cc46a', ORANGE = '#f28a3a';
const DUDE = '#ff8fb1', INK = '#4b322b', CREAM = '#fff6e8';

// Timing windows (seconds)
const PERFECT_WIN = 0.075, GOOD_WIN = 0.15, EARLY_IGNORE = 0.32;
const START_BPM = 96, BPM_STEP = 8, MAX_BPM = 188, JUMPS_PER_LEVEL = 16;

// Rhythm patterns (in beats between pads); higher levels unlock more
const POOLS = [
  [[1, 1, 1, 1], [1, 1, 2], [2, 1, 1], [1, 1, 1, 1]],
  [[1, 0.5, 0.5, 1, 1], [1.5, 1.5, 1], [1, 1, 1, 0.5, 0.5]],
  [[0.5, 0.5, 0.5, 0.5, 1, 1], [2, 0.5, 0.5, 1], [1.5, 0.5, 1, 1]],
];
// A minor: Am – F – C – G
const PROG = [
  { root: 45, tones: [57, 60, 64] },
  { root: 41, tones: [57, 60, 65] },
  { root: 48, tones: [55, 60, 64] },
  { root: 43, tones: [55, 59, 62] },
];
// worlds take turns as you climb: each has its own chord loop and its own clay backdrop
const WORLDS = [
  { name: 'MEADOW', prog: PROG, sky: ['#bfe0e3', '#fde3c6', '#6b7db5', '#b7c4e4'],
    far: '#a8c98c', near: '#78ad68', ground: ['#6c9f5c', '#4e7a44'], sun: '#f7ad3a' },
  { name: 'SUNSET', sky: ['#f6b98a', '#fde2b8', '#a9577e', '#eea07e'],
    far: '#e3a46e', near: '#c97b50', ground: ['#b86a40', '#8f4e2f'], sun: '#ff7a45',
    prog: [ // C major: C – G – Am – F
      { root: 48, tones: [55, 60, 64] }, { root: 43, tones: [55, 59, 62] },
      { root: 45, tones: [57, 60, 64] }, { root: 41, tones: [57, 60, 65] }] },
  { name: 'MOONLIGHT', sky: ['#7d8bcc', '#b4bfec', '#2c3166', '#5d62a4'],
    far: '#8292d2', near: '#5d6db3', ground: ['#4b5896', '#343f73'], sun: '#f3ecd0',
    prog: [ // D minor: Dm – Bb – F – C
      { root: 50, tones: [57, 62, 65] }, { root: 46, tones: [58, 62, 65] },
      { root: 41, tones: [57, 60, 65] }, { root: 48, tones: [55, 60, 64] }] },
];
const LEVELS_PER_WORLD = 3;

// ---------------- seeds ----------------
// Every run has a seed. Pads, power-ups and invasions come from (seed, pad index), never from a
// running stream, so two runs on one seed share a layout however differently they are played.
// That is what makes the daily run fair and lets a ghost from a share link hop on your pads.
const fmix = h => { h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); return (h ^ h >>> 16) >>> 0; };
let seed = 1;
const sr = (i, k) => fmix(fmix(fmix(seed) ^ Math.imul(i, 0x9e3779b1)) ^ Math.imul(k, 0x7f4a7c15)) / 4294967296;
// daily runs are numbered from the first of January 2026, by the player's own calendar
function today() {
  const d = new Date();
  return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 0, 1)) / 864e5) + 1;
}
const dailySeed = n => fmix(n * 7919 + 13);

// ---------------- saved stuff ----------------
const store = {
  get(k, d) { try { const v = localStorage.getItem('hopbeat-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hopbeat-' + k, JSON.stringify(v)); } catch (e) {} },
};
const stats = Object.assign({ runs: 0, best: 0, alt: 0, perfects: 0, repelled: 0, flawless: 0, boss: 0, ghosts: 0, streakMax: 0 },
  store.get('stats', {}));
const look = Object.assign({ hat: 'none', phones: 0 }, store.get('look', {}));
let userOff = +store.get('offset', 0) || 0; // calibrated tap offset, seconds

// ---------------- layout ----------------
// BP = size unit for pads/dude/rings, VSTEP = pixels climbed per beat
let W = 0, H = 0, DPR = 1, BP = 150, VSTEP = 140;
let vignette, sunR = 100;
// stop-motion: decorative wobble re-rolls 12 times a second, like clay re-posed between frames
let boil = 0;
const stars = Array.from({ length: 36 }, () => ({
  x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.7, p: Math.random() * TAU,
}));
// puffy clay clouds pinned at different depths in front of the backdrop
const clouds = Array.from({ length: 9 }, (_, i) => {
  const n = 4 + (Math.random() * 3 | 0);
  return {
    x: Math.random(), y: i / 9 + Math.random() * 0.08, s: 0.6 + Math.random() * 0.7, d: 0.15 + Math.random() * 0.35,
    puffs: Array.from({ length: n }, (_, j) => ({
      x: (j / (n - 1) - 0.5) * 1.7, y: -Math.sin(Math.PI * j / (n - 1)) * (0.35 + Math.random() * 0.25),
      r: 0.42 + Math.random() * 0.28,
    })),
  };
});
const floaters = Array.from({ length: 12 }, () => ({
  x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.8, p: Math.random() * TAU,
  ch: Math.random() < 0.5 ? '♪' : '♫', col: Math.random() < 0.5 ? PINK : TEAL,
}));
function makeRidge(n, amp) {
  const a = [], p1 = Math.random() * 9, p2 = Math.random() * 9, p3 = Math.random() * 9;
  for (let i = 0; i < n; i++) {
    const x = i / n * TAU;
    a.push(amp * (0.55 + 0.25 * Math.sin(x * 3 + p1) + 0.14 * Math.sin(x * 7 + p2) + 0.06 * Math.sin(x * 17 + p3)));
  }
  return a;
}
const ridgeFar = makeRidge(48, 0.16), ridgeNear = makeRidge(36, 0.1);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  BP = clamp(W * 0.28, 100, 180);
  VSTEP = clamp(H * 0.19, 100, 170);
  vignette = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(90,50,30,0)'); vignette.addColorStop(1, 'rgba(90,50,30,0.3)');
  sunR = Math.min(W, H) * 0.2;
}
addEventListener('resize', resize);
resize();

// ---------------- clay look ----------------
// speckles plus a few pressed-in fingerprints, tiled over every clay surface
function makeTex(size, dots, prints) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  for (let i = 0; i < dots; i++) {
    x.fillStyle = Math.random() < 0.55 ? `rgba(60,35,25,${0.05 + Math.random() * 0.09})` : `rgba(255,255,255,${0.06 + Math.random() * 0.12})`;
    x.beginPath(); x.arc(Math.random() * size, Math.random() * size, 0.4 + Math.random() * 1.1, 0, TAU); x.fill();
  }
  x.lineWidth = 0.9; x.strokeStyle = 'rgba(60,35,25,0.07)';
  for (let i = 0; i < prints; i++) {
    const cx = size * (0.3 + Math.random() * 0.4), cy = size * (0.3 + Math.random() * 0.4), a0 = Math.random() * TAU;
    for (let k = 1; k < 7; k++) {
      x.beginPath(); x.ellipse(cx, cy, k * 3.4, k * 2.5, a0, a0, a0 + 2 + Math.random() * 1.5); x.stroke();
    }
  }
  return g.createPattern(c, 'repeat');
}
const clayPat = makeTex(160, 900, 2), grainPat = makeTex(256, 2600, 0);
const rgbCache = {};
const rgbOf = hex => rgbCache[hex] || (rgbCache[hex] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)));
// blend two hex colours; shade() pushes one toward warm white (k > 0) or deep brown (k < 0)
function mix(a, b, k) { const p = rgbOf(a), q = rgbOf(b); return `rgb(${p.map((v, i) => Math.round(v + (q[i] - v) * k))})`; }
// same blend, but as hex so the result can be blended again (world palettes fade into each other)
const mixHex = (a, b, k) => '#' + rgbOf(a).map((v, i) => Math.round(v + (rgbOf(b)[i] - v) * k).toString(16).padStart(2, '0')).join('');
const shade = (hex, k) => k < 0 ? mix(hex, '#2a1712', -k) : mix(hex, '#fffaf0', k);
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
// a hand-pressed ellipse: its outline shifts a little on every stop-motion frame
function blob(x, y, rx, ry, seed, amt = 0.035) {
  const n = 12, pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, w = 1.03 + (hash(i, seed + boil) - 0.5) * 2 * amt;
    pts.push([x + Math.cos(a) * rx * w, y + Math.sin(a) * ry * w]);
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const s = mid(pts[n - 1], pts[0]);
  g.beginPath(); g.moveTo(s[0], s[1]);
  for (let i = 0; i < n; i++) { const e = mid(pts[i], pts[(i + 1) % n]); g.quadraticCurveTo(pts[i][0], pts[i][1], e[0], e[1]); }
  g.closePath();
}
// clay models stand in front of a painted backdrop, so they throw a soft shadow down-right
function castShadow(s) {
  g.shadowColor = 'rgba(80,45,25,0.3)'; g.shadowBlur = 12 * s * DPR;
  g.shadowOffsetX = 6 * s * DPR; g.shadowOffsetY = 10 * s * DPR;
}
function noShadow() { g.shadowColor = 'transparent'; g.shadowBlur = g.shadowOffsetX = g.shadowOffsetY = 0; }
// fill the current path as a lump of clay lit from the top-left, then press the texture into it
function clayFill(x, y, r, col) {
  const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.45, r * 0.05, x, y, r * 1.25);
  gr.addColorStop(0, shade(col, 0.4)); gr.addColorStop(0.45, col); gr.addColorStop(1, shade(col, -0.3));
  g.fillStyle = gr; g.fill();
  noShadow();
  clayPat.setTransform(new DOMMatrix([1, 0, 0, 1, x, y]));
  g.fillStyle = clayPat; g.fill();
}

// ---------------- audio ----------------
let ac = null, master, fx, delayNode, noiseBuf, latency = 0;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 12; comp.ratio.value = 3;
  comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0.75;
  master.connect(comp); comp.connect(ac.destination);
  delayNode = ac.createDelay(2); delayNode.delayTime.value = 0.45;
  const fb = ac.createGain(); fb.gain.value = 0.36;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3000;
  delayNode.connect(lp); lp.connect(fb); fb.connect(delayNode); lp.connect(master);
  fx = ac.createGain(); fx.gain.value = 0.35; fx.connect(delayNode);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function env(node, t, a, peak, dec) {
  node.gain.setValueAtTime(0.0001, t);
  node.gain.exponentialRampToValueAtTime(peak, t + a);
  node.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}
function kick(t, v = 1) {
  const o = ac.createOscillator(), gn = ac.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.14);
  env(gn, t, 0.002, v, 0.38);
  o.connect(gn).connect(master); o.start(t); o.stop(t + 0.45);
}
function noise(t, dur, freq, type, v, send = 0) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const gn = ac.createGain(); env(gn, t, 0.001, v, dur);
  s.connect(f).connect(gn).connect(master);
  if (send) { const sg = ac.createGain(); sg.gain.value = send; gn.connect(sg).connect(fx); }
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
function snare(t, v = 1) {
  noise(t, 0.2, 1900, 'bandpass', 0.55 * v, 0.4);
  const o = ac.createOscillator(), gn = ac.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
  env(gn, t, 0.001, 0.35 * v, 0.1); o.connect(gn).connect(master); o.start(t); o.stop(t + 0.15);
}
function hat(t, v) { noise(t, 0.045, 7500, 'highpass', v); }
function bass(t, m, dur) {
  const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 7;
  f.frequency.setValueAtTime(1500, t); f.frequency.exponentialRampToValueAtTime(160, t + dur);
  const gn = ac.createGain(); env(gn, t, 0.005, 0.3, dur);
  o.connect(f).connect(gn).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function pad(t, notes, dur) {
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1000;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(0.05, t + 0.3);
  gn.gain.setValueAtTime(0.05, t + dur - 0.15); gn.gain.linearRampToValueAtTime(0.0001, t + dur + 0.3);
  f.connect(gn); gn.connect(master);
  for (const m of notes) for (const det of [-8, 8]) {
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
    o.connect(f); o.start(t); o.stop(t + dur + 0.35);
  }
}
function pluck(t, m, v, bright) {
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(bright ? 6000 : 3000, t); f.frequency.exponentialRampToValueAtTime(700, t + 0.45);
  const gn = ac.createGain(); env(gn, t, 0.003, v, 0.7);
  f.connect(gn); gn.connect(master); gn.connect(fx);
  const o1 = ac.createOscillator(); o1.type = bright ? 'square' : 'triangle'; o1.frequency.value = mtof(m);
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = mtof(m + 12);
  for (const o of [o1, o2]) { o.connect(f); o.start(t); o.stop(t + 0.8); }
}
function blip(t, m, v) {
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(m);
  const gn = ac.createGain(); env(gn, t, 0.002, v, 0.12);
  o.connect(gn); gn.connect(master); gn.connect(fx); o.start(t); o.stop(t + 0.16);
}
function missSound(t) {
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.35);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
  const gn = ac.createGain(); env(gn, t, 0.005, 0.3, 0.35);
  o.connect(f).connect(gn).connect(master); o.start(t); o.stop(t + 0.45);
  noise(t, 0.15, 400, 'lowpass', 0.4);
}

function siren(t) {
  const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 700;
  const lfo = ac.createOscillator(); lfo.type = 'triangle'; lfo.frequency.value = 2.5;
  const depth = ac.createGain(); depth.gain.value = 180;
  lfo.connect(depth).connect(o.frequency);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2200;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.11, t + 0.1);
  gn.gain.setValueAtTime(0.11, t + 1.3); gn.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
  o.connect(f).connect(gn); gn.connect(master); gn.connect(fx);
  o.start(t); lfo.start(t); o.stop(t + 1.75); lfo.stop(t + 1.75);
}
function scratch(t) { // vinyl scratch: noise + pitch swept forth and back
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  s.playbackRate.setValueAtTime(0.6, t); s.playbackRate.linearRampToValueAtTime(2.4, t + 0.07);
  s.playbackRate.linearRampToValueAtTime(0.5, t + 0.16);
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
  f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(2600, t + 0.07); f.frequency.linearRampToValueAtTime(700, t + 0.16);
  const gn = ac.createGain(); env(gn, t, 0.005, 0.45, 0.17);
  s.connect(f).connect(gn).connect(master); s.start(t); s.stop(t + 0.2);
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(260, t); o.frequency.linearRampToValueAtTime(900, t + 0.07); o.frequency.linearRampToValueAtTime(180, t + 0.16);
  const og = ac.createGain(); env(og, t, 0.005, 0.08, 0.16);
  o.connect(og).connect(master); o.start(t); o.stop(t + 0.2);
}
function stab(t, notes, v) {
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(3500, t); f.frequency.exponentialRampToValueAtTime(600, t + 0.2);
  const gn = ac.createGain(); env(gn, t, 0.003, v, 0.2);
  f.connect(gn); gn.connect(master); gn.connect(fx);
  for (const m of notes) {
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m);
    o.connect(f); o.start(t); o.stop(t + 0.25);
  }
}

// ---------------- musical timeline ----------------
let keyShift = 0; // semitones; invaders drag the whole track into their key
// steps[i] = audio-clock time of 16th-note i. Tempo changes land on bar lines.
let steps = [], stepBpm = [], stepWorld = [], genTime = 0, bpm = START_BPM, targetBpm = START_BPM, schedIdx = 0;
// world changes also land on bar lines; shownWorld follows what is actually being heard
let world = 0, targetWorld = 0, worldStart = 0, shownWorld = 0, worldFrom = 0, worldT0 = -9;
function ensureSteps(i) {
  while (steps.length <= i) {
    if (steps.length % 16 === 0) {
      if (bpm !== targetBpm) {
        bpm = targetBpm;
        delayNode.delayTime.setValueAtTime(0.75 * 60 / bpm, genTime);
      }
      world = targetWorld;
    }
    steps.push(genTime); stepBpm.push(bpm); stepWorld.push(world);
    genTime += 60 / bpm / 4;
  }
}
const chordAt = i => WORLDS[stepWorld[i] || 0].prog[Math.floor(i / 16) % 4];
function playStep(i, t) {
  const s = i % 16, ch = chordAt(i), sd = 60 / stepBpm[i] / 4, k = keyShift;
  const tones = ch.tones.map(n => n + k);
  if (stepWorld[i] !== shownWorld) {
    worldFrom = shownWorld; shownWorld = stepWorld[i];
    worldT0 = performance.now() / 1000 + (t - ac.currentTime);
    banner = { text: WORLDS[shownWorld].name, sub: 'new world', col: CREAM, t0: worldT0 };
  }
  // the boss's second half swaps the groove for a broken beat
  const brk = inv && inv.phase === 'on' && inv.genre;
  if (brk) {
    if (s === 0 || s === 10) kick(t, 1);
    if (s === 4 || s === 12) snare(t);
    if (s === 7 || s === 15) snare(t, 0.25);
    hat(t, s % 2 ? 0.07 : 0.16);
  } else {
    if (s % 4 === 0) kick(t, s === 0 ? 1 : 0.85);
    if (s === 4 || s === 12) snare(t);
    if (s % 4 === 2) hat(t, 0.2); else if (level >= 2 && s % 2 === 1) hat(t, 0.06);
  }
  if (s === 0) pad(t, tones, sd * 16);
  if (s % 2 === 0) bass(t, ch.root + k + (s % 8 === 6 ? 12 : 0), sd * 1.8);
  if (level >= 3 && s % 2 === 1) blip(t, tones[(s >> 1) % 3] + 24, 0.03);
  if (level >= 4 && s === 14) snare(t, 0.35);
  // the invader's own layer: syncopated saw stabs and an extra clap
  if (inv && inv.phase === 'on') {
    if (s === 0 || s === 6 || s === 10) stab(t, tones.map(n => n + 12), 0.045);
    if (s === 15) snare(t, 0.3);
  }
}
function scheduler() {
  const horizon = ac.currentTime + 0.15;
  for (;;) {
    ensureSteps(schedIdx);
    if (steps[schedIdx] > horizon) break;
    playStep(schedIdx, steps[schedIdx]);
    schedIdx++;
  }
}
setInterval(() => { if (state === 'play' && !paused) scheduler(); else if (state === 'calib') calibSched(); }, 25);
// game time = when the sound reaches your ears, minus however late your fingers land (calibrated)
const now = () => ac ? ac.currentTime - latency - userOff : performance.now() / 1000;
const curBpm = () => stepBpm[Math.max(0, schedIdx - 1)] || START_BPM;

function invaderAct(move, t, i) {

// ---------------- gameplay ----------------
function jumpTo(p, t, hurt) {

function hit(p, grade, t) {

  const perfect = grade === 'PERFECT';

  if (perfect && !pw.rocket) runPerfects++;
  score += (perfect ? 100 : 50) * mult * (pw.double ? 2 : 1);
  jumpTo(p, t, false);
  if (pw.double) pw.double--;
  if (pw.wide) pw.wide--;
  if (pw.rocket) pw.rocket--;
  if (p.power) collect(p);
  // the player plays the melody: arpeggio over the current chord
  const ch = chordAt(p.step).tones;
  const k = keyShift + 12;
  const seq = [ch[0] + k, ch[1] + k, ch[2] + k, ch[0] + k + 12, ch[2] + k, ch[1] + k];
  const at = ac.currentTime + 0.005;
  pluck(at, seq[(combo - 1) % seq.length], perfect ? 0.32 : 0.24, perfect);
  if (perfect && combo % 4 === 0) blip(at + 0.06, seq[(combo + 2) % seq.length] + 12, 0.08);
  const x = px(p), y = platTop(p);
  burst(x, y, perfect ? GOLD : (p.off ? PINK : TEAL), perfect ? 26 : 14, perfect ? 420 : 280);
  popup(x, y - BP * 0.45, grade, perfect ? GOLD : TEAL);
  if (perfect) { flash = 0.12; flashCol = '255,240,200'; }
  if (combo % 32 === 0 && lives < 3) { lives++; popup(x, y - BP * 0.75, '+1 ♥', PINK); }
  if (jumps % JUMPS_PER_LEVEL === 0) {
    level++;
    targetBpm = Math.min(MAX_BPM, START_BPM + (level - 1) * BPM_STEP);
    banner = { text: 'SPEED UP!', sub: targetBpm + ' BPM', t0: performance.now() / 1000 };
    [0, 4, 7, 12].forEach((n, i) => blip(at + 0.12 + i * 0.07, 69 + n, 0.09));
    if ((level - 1) % LEVELS_PER_WORLD === 0) targetWorld = (worldStart + (level - 1) / LEVELS_PER_WORLD) % WORLDS.length;
  }

}
function collect(p) {

  const at = ac.currentTime + 0.02;

function onTap(cx, cy) {

    const b = btns.find(b => cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h);
    if (b && !b.off) press(b.id);
    return;

  if (paused || !audioLive()) { ac.resume(); paused = false; return; }
  const t = now(), p = plats[cur + 1];
  if (!p) return;
  ripples.push({ x: cx, y: cy, t0: rt });
  if (pw.rocket) return; // autopilot
  const dt = t - p.time;
  if (dt < -EARLY_IGNORE) return;
  const q = proj(px(p), wy(p));
  const rad = Math.max(52, BP * 0.5) * q.s * (pw.wide ? 1.8 : 1) * (p.shrink ? 0.65 : 1);
  if (Math.hypot(cx - q.x, cy - q.y) > rad) {
    const dq = p.decoy && proj(px(p.decoy), wy(p.decoy));
    return miss(p, dq && Math.hypot(cx - dq.x, cy - dq.y) < rad * 1.3 ? 'DECOY!' : 'WRONG SPOT', t);

function update(t) {
  let p = plats[cur + 1];
  if (pw.rocket && p && p.state === 0 && t >= p.time - 0.01) { hit(p, 'PERFECT', t); p = plats[cur + 1]; }
  if (p && p.state === 0 && t > p.time + GOOD_WIN) miss(p, 'MISS', t);
  if (state !== 'play') return;

    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.35, life: 1,
      dec: 1.1 + Math.random() * 1.2, size: 1.5 + Math.random() * 3, col });

// ---------------- links: ghosts and friend invasions ----------------
// A share link carries everything in its #hash: the seed, the daily number, the sharer's run as a
// run-length string of p(erfect) g(ood) m(iss) per pad, and their score. A DJ link carries a name,
// a colour and a set of move letters instead. No server: the link is the save file.
const rle = s => s.replace(/(.)\1*/g, m => m[0] + (m.length > 1 ? m.length : ''));
const unrle = s => s.replace(/([pgm])(\d*)/g, (_, c, n) => c.repeat(Math.min(+n || 1, 5000)));
const CODE_MOVE = Object.fromEntries(Object.entries(MOVE_CODE).map(([k, v]) => [v, k]));
const cleanName = s => (s || '').toUpperCase().replace(/[^A-Z0-9 .!?'-]/g, '').trim().slice(0, 14);
function readLink() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.has('dj')) {
    const set = [...(q.get('m') || '')].map(c => CODE_MOVE[c]).filter(Boolean).slice(0, 8);
    if (!set.length) return null;
    const col = DJ_COLS[clamp(+q.get('c') || 0, 0, DJ_COLS.length - 1)];
    return { dj: { name: cleanName(q.get('dj')) || 'A FRIEND', col, rgb: rgbOf(col).join(','), transpose: 2, set, friend: true,
      taunts: ['this one’s for you', 'made this set myself', 'dance, friend!'] } };
  }
  if (q.has('s')) {
    const c = { seed: (+q.get('s') || 0) >>> 0, daily: +q.get('d') || 0 };
    const gl = unrle(q.get('g') || '');
    if (/^[pgm]+$/.test(gl)) { c.ghost = gl; c.gscore = +q.get('sc') || 0; }
    return c;
  }
  return null;
}

// ---------------- ghost ----------------
// The ghost keeps your clock: it stands on the newest pad whose beat has passed, for as many pads
// as its run lasted, then tumbles off. Its live score is its hit-by-hit score scaled to its final one.
let ghost = null;
function makeGhost(log, final) {
  const cum = [0];
  let c = 0, s = 0;
  for (const ch of log) {
    if (ch === 'm') c = 0;
    else { c++; s += (ch === 'p' ? 100 : 50) * Math.min(8, 1 + Math.floor(c / 8)); }
    cum.push(s);
  }
  return { log, cum, score: final || s };
}
function ghostPad(t) {
  let p = null;
  for (const q of plats) if (q.time != null && q.time <= t) p = q;
  return p;
}
function ghostScore(t) {
  const p = ghostPad(t), c = ghost.cum, end = c[c.length - 1];
  return p && end ? Math.round(c[Math.min(p.i, ghost.log.length)] * ghost.score / end) : 0;
}
function drawGhost(t) {
  if (!ghost) return;
  const p = ghostPad(t);
  if (!p) return;
  const L = ghost.log.length, at = i => plats.find(q => q.i === i);
  let x, y, rot = 0;
  if (p.i > L) { // its run ended on pad L
    const d0 = at(L), d1 = at(L + 1);
    if (!d0 || !d1) return;
    const d = t - d1.time;
    if (d > 1.5) return;
    x = px(d0) + d * 70; y = platTop(d0) - 380 * d + 1500 * d * d; rot = d * 6;
  } else {
    const prev = at(p.i - 1) || p, k = clamp((t - p.time) / 0.22, 0, 1);
    x = lerp(px(prev), px(p), k);
    y = lerp(platTop(prev), platTop(p), 1 - Math.pow(1 - k, 2)) - Math.sin(k * Math.PI) * BP * 0.35;
  }
  // it stands just beside you on the pad, so the two of you never hide each other
  const q = proj(x, y), R = BP * 0.13 * q.s, gx = q.x + (px(p) > W / 2 ? -1 : 1) * R * 2.3;
  const hurt = p.i <= L && p.i > 0 && ghost.log[p.i - 1] === 'm' && t - p.time < 0.45;
  g.save(); g.translate(gx, q.y); g.rotate(rot);
  g.globalAlpha = 0.5;
  blob(0, -R * 1.1, R, R * 1.1, 13, 0.05); g.fillStyle = hurt ? '#ffd0d0' : '#fffaf0'; g.fill();
  g.strokeStyle = 'rgba(75,50,43,0.5)'; g.lineWidth = 2; g.stroke();
  g.fillStyle = INK;
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * R * 0.32, -R * 1.2, R * 0.12, R * 0.2, 0, 0, TAU); g.fill(); }
  g.restore();
  g.font = `700 ${Math.round(clamp(R * 0.7, 10, 14))}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(75,50,43,0.6)'; g.fillText('GHOST', gx, q.y - R * 2.7);
}

// a Wordle-style strip: the run cut into ten slices, gold = all perfect, green = clean, red = a miss
function shareCard() {
  const L = runLog.length, n = Math.min(10, L), cells = [];
  for (let k = 0; k < n; k++) {
    const seg = runLog.slice(Math.floor(k * L / n), Math.floor((k + 1) * L / n));
    cells.push(seg.includes('m') ? '🟥' : /^p+$/.test(seg) ? '🟨' : '🟩');
  }
  const o = overInfo || { alt: 0, streak: 0 };
  const lines = [dailyNo ? `Hopbeat Daily #${dailyNo}${o.streak > 1 ? ' 🔥' + o.streak : ''}` : 'Hopbeat',
    cells.join(''), `${score.toLocaleString('en-US')} pts · ▲ ${o.alt} m · ${maxCombo}× combo`];
  if (friendDJ) lines.push(friendDJ.beaten ? `Survived ${friendDJ.name}’s set 🎧` : `Taken out by ${friendDJ.name} 💀`);
  if (ghost) lines.push(o.ghostWin ? 'Beat my friend’s ghost 👻' : 'Lost to the ghost 👻');
  lines.push('Race my ghost: ' + shareLink());
  return lines.join('\n');
}

// phones get the share sheet; everywhere else the text goes on the clipboard
async function sendText(text, title) {
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ title, text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toastMsg('Copied! Paste it to a friend'); }
  catch (e) { copyFallback(text); }
}
// older browsers and locked-down webviews: try the legacy copy, else leave the text selected in a box
function copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.readOnly = true;
  ta.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,420px);height:170px;' +
    `font:15px ${FONT};border:4px solid ${PINK};border-radius:18px;padding:12px;background:${CREAM};color:${INK};z-index:9`;
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;

let lastRt = performance.now() / 1000, camT = lastRt;
function beatPulse(t) {
  if (!steps.length || inMenu()) return Math.exp(-((t % 0.6)) * 7);

  i -= i % 4;

}

  const menu = inMenu(), t = menu ? rt : now();
  clock = t;
  if (state === 'play' && !paused) { scheduler(); update(t); }
  const pulse = beatPulse(t);
  boil = Math.floor(rt * 12);
  btns = [];

  // dude & camera
  let pos, rot = 0;
  if (dude.dead) {
    const d = rt - dude.deadT;
    pos = { x: dude.dx + dude.dvx * Math.min(d, 1.5), y: dude.dy - 380 * d + 1500 * d * d, air: true };
    rot = d * 7;
  } else {
    pos = dudePos(t);
    // frame-rate independent follow, so slow devices never leave the camera behind
    camY += (platTop(dude.to) - H * 0.72 - camY) * (1 - Math.exp(-clamp(rt - camT, 0, 1) * 6));
  }
  camT = rt;
  dude.squash *= Math.pow(0.0005, dtf);
  if (pos.air && !dude.dead) trail.push({ x: pos.x, y: pos.y, a: 1 });

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.save();
  if (shake > 0.2) { g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= Math.pow(0.002, dtf); }
  drawBackground(boil / 12, pulse, palette(rt));
  if (t < blackoutUntil) { g.fillStyle = 'rgba(30,18,12,0.82)'; g.fillRect(-20, -20, W + 40, H + 40); }
  drawPlatforms(t, pulse, pos);
  if (!menu) drawGhost(t);

  // trail: a soft clay smear behind the jump
  const trailCol = pw.rocket ? '242,138,58' : '255,143,177';
  for (let i = trail.length - 1; i >= 0; i--) {
    const p = trail[i]; p.a -= dtf * (pw.rocket ? 2.5 : 4);
    if (p.a <= 0) { trail.splice(i, 1); continue; }
    const q = proj(p.x, p.y);
    g.fillStyle = `rgba(${trailCol},${p.a * 0.3})`;
    g.beginPath(); g.arc(q.x, q.y - BP * 0.15 * q.s, BP * 0.13 * p.a * q.s, 0, TAU); g.fill();
  }
  const dq = proj(pos.x, pos.y);
  drawDude(dq.x, dq.y, t, pos.air, pulse, rot, dq.s);

  // particles: little clay crumbs
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= p.dec * dtf;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += 900 * dtf; p.x += p.vx * dtf; p.y += p.vy * dtf; p.vx *= 0.985;
    const q = proj(p.x, p.y);
    g.globalAlpha = Math.min(1, p.life * 1.5); g.fillStyle = p.col;
    g.beginPath(); g.arc(q.x, q.y, p.size * q.s * (0.5 + p.life * 0.5), 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  // tap ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i], a = (rt - r.t0) / 0.35;
    if (a >= 1) { ripples.splice(i, 1); continue; }
    g.strokeStyle = `rgba(75,50,43,${0.5 * (1 - a)})`; g.lineWidth = 3;
    g.beginPath(); g.arc(r.x, r.y, 8 + a * 34, 0, TAU); g.stroke();
  }
  // popups
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i], a = (rt - p.t0) / 0.8;
    if (a >= 1) { pops.splice(i, 1); continue; }
    g.globalAlpha = 1 - a * a;
    const s = Math.round(clamp(BP * 0.14, 15, 26) * (1 + Math.max(0, 0.15 - a) * 2));
    const q = proj(p.x, p.y);
    clayText(p.text, q.x, q.y - a * 40, s, p.col);
  }
  g.globalAlpha = 1;
  g.restore();

  // screen overlays
  if (flash > 0.01) { g.fillStyle = `rgba(${flashCol},${flash * 0.5})`; g.fillRect(0, 0, W, H); flash *= Math.pow(0.001, dtf); }
  // film grain, re-rolled each stop-motion frame
  grainPat.setTransform(new DOMMatrix([1, 0, 0, 1, hash(boil, 1) * 256, hash(boil, 2) * 256]));
  g.globalAlpha = 0.55; g.fillStyle = grainPat; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  g.fillStyle = vignette; g.fillRect(0, 0, W, H);
  if (inv && inv.phase !== 'leave') { // invader's colour bleeds in from the screen edges
    const k = inv.phase === 'warn' ? 0.25 + 0.25 * Math.abs(Math.sin(rt * 8)) : 0.12 + pulse * 0.12;
    const eg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.72);
    eg.addColorStop(0, `rgba(${inv.who.rgb},0)`); eg.addColorStop(1, `rgba(${inv.who.rgb},${k})`);
    g.fillStyle = eg; g.fillRect(0, 0, W, H);
  }
  if (!menu) drawBooth(rt, pulse);
  if (state === 'title') drawTitle(rt);
  else if (state === 'calib') drawCalib(rt);
  else if (state === 'closet') drawCloset(rt, pulse);
  else if (state === 'dj') drawDJ(rt, pulse);
  else { drawHUD(rt, pulse); if (state === 'over') drawOver(rt); }
  drawToast(rt);
}
function inMenu() { return state === 'title' || state === 'calib' || state === 'closet' || state === 'dj'; }
setupTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
